<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RFV Admin</title><style>body{font:16px system-ui;background:#f3f7f8;color:#17252b;margin:0;padding:24px}.wrap{max-width:760px;margin:auto;background:white;padding:24px;border-radius:18px;border:1px solid #dce5e8}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #cbd8dd}button{cursor:pointer;background:#176b60;color:white;border:0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row input{flex:1;min-width:200px}.code{padding:12px;background:#eef5f3;border-radius:9px;margin:10px 0}.muted{color:#62747b}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e2e9eb}small{color:#667}</style></head><body><main class="wrap"><h1>RFV Admin Control</h1><p class="muted">Admin Key শুধু এখানে প্রবেশ করাও। এটি ওয়েবসাইটের HTML-এ রাখা নেই।</p><div class="row"><input id="key" type="password" placeholder="Admin Key"><button onclick="connect()">Connect</button></div><hr><h2>নতুন Access Code তৈরি</h2><div class="row"><input id="label" placeholder="ব্যবহারকারীর নাম / পরিচিতি (ঐচ্ছিক)"><button onclick="createCode()">Create Code</button></div><div id="newcode"></div><h2>ব্যবহারকারীদের কোড</h2><button onclick="loadCodes()">Refresh List</button><div id="list"></div><p class="muted"><small>কোড তৈরি হলে একবারই পূর্ণ কোড দেখানো হবে। ব্যবহারকারীকে নিরাপদে পাঠাও। একই কোড একাধিক ব্যক্তি ব্যবহার করলে তাদের Progress একই হবে।</small></p></main><script>let adminKey=sessionStorage.getItem('rfv_admin_key')||'';document.getElementById('key').value=adminKey;async function call(method,body){const r=await fetch('/api/admin-codes',{method,headers:{'Content-Type':'application/json','X-Admin-Key':document.getElementById('key').value},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function connect(){try{await loadCodes();sessionStorage.setItem('rfv_admin_key',document.getElementById('key').value)}catch(e){alert(e.message)}}async function createCode(){try{const d=await call('POST',{label:document.getElementById('label').value});document.getElementById('newcode').innerHTML='<div class="code"><b>নতুন Access Code: '+d.code+'</b><br><small>এখনই কপি করে ব্যবহারকারীকে পাঠাও; পরে পূর্ণ কোড আর দেখানো হবে না।</small></div>';document.getElementById('label').value='';await loadCodes()}catch(e){alert(e.message)}}async function loadCodes(){try{const d=await call('GET');document.getElementById('list').innerHTML='<table><tr><th>পরিচিতি</th><th>অবস্থা</th><th>তৈরির সময়</th><th></th></tr>'+d.codes.map(c=>'<tr><td>'+esc(c.label||'—')+'</td><td>'+(c.active?'Active':'Revoked')+'</td><td>'+new Date(c.created_at).toLocaleDateString()+'</td><td>'+(c.active?'<button onclick="revoke(''+c.id+'')">Revoke</button>':'')+'</td></tr>').join('')+'</table>'}catch(e){document.getElementById('list').textContent=e.message;throw e}}async function revoke(id){if(!confirm('এই Access Code বাতিল করবে?'))return;try{await call('DELETE',{id});await loadCodes()}catch(e){alert(e.message)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
