
<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RFV Admin</title>

<style>
body{
  font:16px system-ui;
  background:#f3f7f8;
  color:#17252b;
  margin:0;
  padding:24px;
}
.wrap{
  max-width:900px;
  margin:auto;
  background:white;
  padding:24px;
  border-radius:18px;
  border:1px solid #dce5e8;
}
input,button{
  font:inherit;
  padding:11px;
  border-radius:9px;
  border:1px solid #cbd8dd;
}
button{
  cursor:pointer;
  background:#176b60;
  color:white;
  border:0;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.reset{
  background:#276b9a;
}
.revoke{
  background:#b33b3b;
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 0;
}
.row input{
  flex:1;
  min-width:200px;
}
.code{
  padding:12px;
  background:#eef5f3;
  border-radius:9px;
  margin:10px 0;
  overflow-wrap:anywhere;
}
.muted{
  color:#62747b;
}
.table-wrap{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  min-width:650px;
}
td,th{
  text-align:left;
  padding:10px;
  border-bottom:1px solid #e2e9eb;
}
.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
small{
  color:#667;
}
</style>
</head>

<body>

<main class="wrap">

<h1>RFV Admin Control</h1>

<p class="muted">
Admin Key শুধু এখানে প্রবেশ করাও। এটি ওয়েবসাইটের HTML-এ রাখা নেই।
</p>

<div class="row">
  <input id="key" type="password" placeholder="Admin Key">
  <button onclick="connect()">Connect</button>
</div>

<hr>

<h2>নতুন Access Code তৈরি</h2>

<div class="row">
  <input id="label" placeholder="ব্যবহারকারীর নাম / পরিচিতি (ঐচ্ছিক)">
  <button onclick="createCode()">Create Code</button>
</div>

<div id="newcode"></div>

<hr>

<h2>ব্যবহারকারীদের কোড</h2>

<p class="muted">
প্রতিটি Access Code সর্বোচ্চ ৩টি Device-এ ব্যবহার করা যাবে।
</p>

<button onclick="loadCodes()">Refresh List</button>

<div id="list"></div>

<p class="muted">
<small>
কোড তৈরি হলে একবারই পূর্ণ কোড দেখানো হবে।
একই কোড একাধিক ব্যক্তি ব্যবহার করলে তাদের Progress একই হবে।
</small>
</p>

</main>

<script>

let adminKey = sessionStorage.getItem('rfv_admin_key') || '';

document.getElementById('key').value = adminKey;

async function call(method, body){

  const r = await fetch('/api/admin-codes', {
    method,
    headers:{
      'Content-Type':'application/json',
      'X-Admin-Key':document.getElementById('key').value
    },
    body: body ? JSON.stringify(body) : undefined
  });

  const d = await r.json();

  if(!r.ok){
    throw Error(d.error || 'Request failed');
  }

  return d;
}

async function connect(){

  try{
    await loadCodes();

    sessionStorage.setItem(
      'rfv_admin_key',
      document.getElementById('key').value
    );

    alert('Admin Connected Successfully');

  }catch(e){
    alert(e.message);
  }
}

async function createCode(){

  try{

    const d = await call('POST', {
      label:document.getElementById('label').value
    });

    document.getElementById('newcode').innerHTML =
      '<div class="code">' +
      '<b>নতুন Access Code: ' + esc(d.code) + '</b>' +
      '<br><small>এখনই কপি করে ব্যবহারকারীকে পাঠাও; পরে পূর্ণ কোড আর দেখানো হবে না।</small>' +
      '</div>';

    document.getElementById('label').value = '';

    await loadCodes();

  }catch(e){
    alert(e.message);
  }
}

async function loadCodes(){

  try{

    const d = await call('GET');

    document.getElementById('list').innerHTML =
      '<div class="table-wrap">' +
      '<table>' +
      '<tr>' +
      '<th>পরিচিতি</th>' +
      '<th>Device ব্যবহার</th>' +
      '<th>অবস্থা</th>' +
      '<th>তৈরির সময়</th>' +
      '<th>Action</th>' +
      '</tr>' +

      d.codes.map(c => {

        const count = Number(c.device_count || 0);

        return '<tr>' +

          '<td>' + esc(c.label || '—') + '</td>' +

          '<td><b>' + count + '/3</b></td>' +

          '<td>' + (c.active ? 'Active' : 'Revoked') + '</td>' +

          '<td>' + new Date(c.created_at).toLocaleDateString() + '</td>' +

          '<td><div class="actions">' +

          (c.active
            ? '<button class="reset" onclick="resetDevices(\'' + esc(c.id) + '\')">Reset Devices</button>' +
              '<button class="revoke" onclick="revoke(\'' + esc(c.id) + '\')">Revoke</button>'
            : '—') +

          '</div></td>' +

          '</tr>';

      }).join('') +

      '</table></div>';

  }catch(e){

    document.getElementById('list').textContent = e.message;

    throw e;
  }
}

async function resetDevices(id){

  if(!confirm(
    'এই Access Code-এর সব Device Activation Reset করবে? পুরোনো Session বাতিল হবে, কিন্তু Progress ও History থাকবে।'
  )){
    return;
  }

  try{

    await call('PATCH', {id});

    alert('Device Activation Reset হয়েছে।');

    await loadCodes();

  }catch(e){
    alert(e.message);
  }
}

async function revoke(id){

  if(!confirm('এই Access Code বাতিল করবে?')){
    return;
  }

  try{

    await call('DELETE', {id});

    alert('Access Code বাতিল করা হয়েছে।');

    await loadCodes();

  }catch(e){
    alert(e.message);
  }
}

function esc(s){

  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

}

</script>

</body>
</html>
